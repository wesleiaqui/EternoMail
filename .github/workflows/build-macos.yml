name: macOS Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'DMG architecture (manual artifact-only hotfix build; CI checks run separately)'
        type: choice
        options: [arm64, amd64]
        default: arm64

permissions:
  contents: read

# Automatic builds replace older automatic builds. Each manual hotfix keeps its
# own group so a subsequent main push cannot cancel it.
concurrency:
  group: macos-build-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    # Keep the app and bundled CGO/keychain helper native to the selected CPU.
    runs-on: ${{ inputs.architecture == 'amd64' && 'macos-26-intel' || 'macos-latest' }}
    timeout-minutes: 25
    env:
      GOARCH: ${{ inputs.architecture || 'arm64' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check version and record source
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          ./scripts/version.sh check
          {
            echo '### Artifact-only macOS build'
            echo "Source: $BUILD_SHA"
            echo "Architecture: $GOARCH"
            echo 'CI tests and native acceptance remain separate checks; this run does not publish a release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Wails CLI
        id: wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          # The CLI runs on the runner's architecture, independent of GOARCH.
          key: wails-${{ runner.os }}-${{ runner.arch }}-go1.26-v2.15.0
      - name: Install Wails CLI
        if: steps.wails.outputs.cache-hit != 'true'
        # Cross-compiling Wails would produce a CLI the runner cannot execute.
        run: env -u GOARCH go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/postilaatikko-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Developer ID Application: Olli Sulopuisto (LWSR8T5392)'
      - name: Build macOS app
        run: make build
      - name: Sign app with Developer ID
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/bin/postilaatikko.app
          codesign --verify --deep --strict --verbose=2 build/bin/postilaatikko.app
      - name: Create drag-and-drop DMG
        run: |
          mkdir -p build/bin/dmg-staging
          cp -R build/bin/postilaatikko.app build/bin/dmg-staging/Postilaatikko.app
          ln -s /Applications build/bin/dmg-staging/Applications
          hdiutil create \
            -volname "Postilaatikko" \
            -srcfolder build/bin/dmg-staging \
            -ov \
            -format UDZO \
            "build/bin/Postilaatikko-macos-${GOARCH}.dmg"
          hdiutil verify "build/bin/Postilaatikko-macos-${GOARCH}.dmg"
          rm -rf build/bin/dmg-staging
      - name: Sign and verify DMG
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          DMG_PATH="build/bin/Postilaatikko-macos-${GOARCH}.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/postilaatikko-signing.keychain-db" || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Postilaatikko-macos-${{ env.GOARCH }}-dmg-${{ github.sha }}
          path: build/bin/Postilaatikko-macos-${{ env.GOARCH }}.dmg
          if-no-files-found: error
          retention-days: 14
