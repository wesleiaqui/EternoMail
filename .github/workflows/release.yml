name: Release

on:
  push:
    tags: 'v*'

# Tagged releases are serialized so each run restores the repository deployed by
# the preceding run before publishing its own commits.
concurrency:
  group: ${{ github.repository }}-release-publication
  cancel-in-progress: false

env:
  FLATPAK_REPOSITORY_URL: https://app.weslleys.com/flatpak/repo/

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate release version
        if: matrix.os == 'ubuntu-22.04'
        run: ./scripts/version.sh check "${{ github.ref_name }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows dependencies (NSIS)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Wails detects NSIS via exec.LookPath("makensis") — make sure subsequent steps see it.
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          make build-linux

          # Rename binary with version tag
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            mv build/bin/eterno-mail build/bin/eterno-mail-${{ github.ref_name }}-linux-x86_64
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            mv build/bin/eterno-mail build/bin/eterno-mail-${{ github.ref_name }}-linux-aarch64
          fi

          # Create distribution tarball (complete package for manual installation)
          mkdir -p dist-package
          cp build/bin/eterno-mail-${{ github.ref_name }}-linux-* dist-package/eterno-mail
          cp build/linux/install.sh dist-package/
          cp build/linux/uninstall.sh dist-package/
          cp build/linux/io.github.wesleiaqui.eternomail.desktop dist-package/io.github.wesleiaqui.eternomail.desktop
          cp build/linux/io.github.wesleiaqui.eternomail.png dist-package/io.github.wesleiaqui.eternomail.png

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            tar czf eterno-mail-linux-amd64.tar.gz -C dist-package .
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            tar czf eterno-mail-linux-arm64.tar.gz -C dist-package .
          fi

          rm -rf dist-package

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          make build
          cd build/bin
          zip -r Eterno-Mail-darwin-${{ matrix.arch }}.zip eterno-mail.app
          rm -rf eterno-mail.app

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          make build-windows-installer
          Move-Item build/bin/eterno-mail.exe build/bin/Eterno-Mail-windows-${{ matrix.arch }}.exe
          Move-Item build/bin/eterno-mail-${{ matrix.arch }}-installer.exe build/bin/Eterno-Mail-windows-setup-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: eterno-mail-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: |
            build/bin/eterno-mail-*
            build/bin/Eterno-Mail-*
            eterno-mail-*.tar.gz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Eterno Mail $TAG_NAME" \
              --generate-notes
          fi

          # Upload all release artifacts (binaries and tarballs)
          gh release upload "$TAG_NAME" \
            eterno-mail-*/build/bin/* \
            eterno-mail-*/*.tar.gz \
            --clobber

  update-manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Calculate hashes and update manifest
        run: |
          cd build/flatpak/flathub
          chmod +x calculate-hashes.sh
          ./calculate-hashes.sh ${{ github.ref_name }}

      - name: Generate and check offline npm sources
        run: |
          python3 build/flatpak/flathub/gen-node-sources.py
          python3 build/flatpak/flathub/validate-node-sources.py --check-only
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s build/flatpak/flathub -p 'test_*.py'

      - name: Upload updated manifest and npm sources
        uses: actions/upload-artifact@v7
        with:
          name: flathub-manifest
          path: |
            build/flatpak/flathub/io.github.wesleiaqui.eternomail.yml
            build/flatpak/flathub/node-sources.json
          if-no-files-found: error
          retention-days: 1

  build-flatpak:
    needs: update-manifest
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Download to an empty staging directory. Missing artifact files must
      # fail rather than silently using the stale copies from the tag checkout.
      - uses: actions/download-artifact@v7
        with:
          name: flathub-manifest
          path: ${{ runner.temp }}/flathub-manifest

      - name: Apply prepared Flatpak sources
        run: |
          install -m 644 "${{ runner.temp }}/flathub-manifest/io.github.wesleiaqui.eternomail.yml" build/flatpak/flathub/
          install -m 644 "${{ runner.temp }}/flathub-manifest/node-sources.json" build/flatpak/flathub/

      - name: Set up Node.js for offline cache validation
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Runs natively on BOTH x86_64 and aarch64, with an empty temporary cache.
      - name: Validate offline npm installation before Flatpak
        run: python3 build/flatpak/flathub/validate-node-sources.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl flatpak flatpak-builder ostree

      - name: Add Flathub repository
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes and SDK extensions
        run: |
          flatpak install -y --user flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.golang//25.08 \
            org.freedesktop.Sdk.Extension.node24//25.08

      - name: Clean flatpak-builder cache
        run: |
          rm -rf .flatpak-builder

      # Keeping the old refs here makes the new per-architecture commit a child
      # of the currently published commit instead of starting a disconnected repo.
      - name: Restore published Flatpak repository
        run: |
          build/flatpak/manage-repository.sh restore repo "$FLATPAK_REPOSITORY_URL"

      - name: Build Flatpak (like Flathub would)
        run: |
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-dir build/flatpak/flathub/io.github.wesleiaqui.eternomail.yml

          mkdir -p build/bin
          flatpak build-bundle \
            --arch=${{ matrix.arch }} \
            --repo-url="$FLATPAK_REPOSITORY_URL" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            repo \
            build/bin/Eterno-Mail-${{ github.ref_name }}-${{ matrix.arch }}.flatpak \
            io.github.wesleiaqui.eternomail \
            master

      # Both architectures are uploaded to the release only after both matrix
      # builds have succeeded and their repositories have been consolidated.
      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: build/bin/Eterno-Mail-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 1

      - name: Upload Flatpak repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-repository-${{ matrix.arch }}
          path: repo/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy-flatpak-repository:
    needs: build-flatpak
    if: ${{ !contains(github.ref_name, '-build') && !contains(github.ref_name, '-test') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Preserve the existing project website and add the Flatpak repository
      # below /flatpak instead of replacing the Pages content.
      - name: Build existing Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl flatpak ostree

      - name: Download x86_64 Flatpak repository
        uses: actions/download-artifact@v7
        with:
          name: flatpak-repository-x86_64
          path: ${{ runner.temp }}/flatpak-repositories/x86_64

      - name: Download aarch64 Flatpak repository
        uses: actions/download-artifact@v7
        with:
          name: flatpak-repository-aarch64
          path: ${{ runner.temp }}/flatpak-repositories/aarch64

      - name: Download x86_64 Flatpak bundle
        uses: actions/download-artifact@v7
        with:
          name: flatpak-bundle-x86_64
          path: ${{ runner.temp }}/flatpak-bundles

      - name: Download aarch64 Flatpak bundle
        uses: actions/download-artifact@v7
        with:
          name: flatpak-bundle-aarch64
          path: ${{ runner.temp }}/flatpak-bundles

      - name: Consolidate Flatpak repository
        run: |
          mkdir -p _site/flatpak
          build/flatpak/manage-repository.sh restore \
            _site/flatpak/repo "$FLATPAK_REPOSITORY_URL"
          build/flatpak/manage-repository.sh merge \
            _site/flatpak/repo \
            "${{ runner.temp }}/flatpak-repositories/x86_64" \
            x86_64
          build/flatpak/manage-repository.sh merge \
            _site/flatpak/repo \
            "${{ runner.temp }}/flatpak-repositories/aarch64" \
            aarch64
          build/flatpak/manage-repository.sh finalize _site/flatpak/repo
          install -m 644 build/flatpak/eternomail.flatpakrepo _site/flatpak/

      - name: Upload both Flatpak bundles to GitHub Release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ runner.temp }}"/flatpak-bundles/Eterno-Mail-*.flatpak \
            --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy Flatpak repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  commit-manifest:
    needs: deploy-flatpak-repository
    if: ${{ !contains(github.ref_name, '-build') && !contains(github.ref_name, '-test') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main before applying release artifact
        uses: actions/checkout@v6
        with:
          ref: main

      # Download to an empty staging directory. Missing artifact files must
      # fail rather than silently using the stale copies from the tag checkout.
      - uses: actions/download-artifact@v7
        with:
          name: flathub-manifest
          path: ${{ runner.temp }}/flathub-manifest

      - name: Apply prepared Flatpak sources
        run: |
          install -m 644 "${{ runner.temp }}/flathub-manifest/io.github.wesleiaqui.eternomail.yml" build/flatpak/flathub/
          install -m 644 "${{ runner.temp }}/flathub-manifest/node-sources.json" build/flatpak/flathub/

      - name: Commit updated manifest
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 build/flatpak/flathub/validate-node-sources.py --check-only
          git add build/flatpak/flathub/io.github.wesleiaqui.eternomail.yml build/flatpak/flathub/node-sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "${{ github.ref_name }} - Flathub submission"
          git push origin main
